# Wan 2.1 base configuration for LongLive
model_name: Wan2.1-T2V-1.3B
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 3
denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true
num_frame_per_block: 3

# VAE configuration
# vae_impl: 'wan' (default, standard WanVAE) or 'lightvae' (75% pruned, lower VRAM)
vae_impl: lightvae

# Optional: specify a VAE checkpoint path to auto-download and use.
# If the file does not exist, it will be downloaded from `lightx2v/Autoencoders`.
# Use LightVAE for Wan2.1 by default to test performance/VRAM improvements.
vae_path: ~/.daydream-scope/models/Wan2.1-T2V-1.3B/lightvaew2_1.pth

adapter:
  type: "lora"
  rank: 256                   # LoRA rank (typical values: 8, 16, 32, 64)
  alpha: 256                  # LoRA alpha (typically same as rank, but can be different)
  dropout: 0.0                # LoRA dropout rate
  dtype: "bfloat16"           # Data type for LoRA parameters: "bfloat16", "float16", "float32"
  verbose: false              # Whether to print all target module names
